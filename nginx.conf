server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects relative so the external HTTPS scheme and host
    # are preserved when Nginx is behind the Coolify proxy.
    absolute_redirect off;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /posts/ {
        autoindex on;
        autoindex_format json;
    }
}
