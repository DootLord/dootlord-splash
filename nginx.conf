server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects relative so the external HTTPS scheme and host
    # are preserved when Nginx is behind the Coolify proxy.
    absolute_redirect off;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Old /blog/?p=<post> links -> the post's own page, permanently, so search
    # engines move any ranking over. Drafts (names starting with _) have no page
    # and keep the ?p= form.
    location = /blog/ {
        if ($arg_p ~ "^[^_/][^/]*$") {
            return 301 /blog/$arg_p/;
        }
    }

    location /posts/ {
        autoindex on;
        autoindex_format json;
    }

    # The raw Markdown and the manifest are for the blog script, not for search
    # results: keep them out of the index so they don't compete with the post
    # pages. Images in /posts/img/ stay indexable.
    location ~* ^/posts/.+\.(md|json)$ {
        add_header X-Robots-Tag "noindex" always;
    }
}
