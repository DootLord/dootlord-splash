<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DOOTLORD social preview</title>
  <meta name="robots" content="noindex">
  <!--
    Source for assets/img/social-preview.png (1200 x 630), the image shown when
    the site is shared. Built from the site's own CSS, sprites and background,
    so it changes with them. To re-render, serve the repo root and screenshot:

      python -m http.server 8000
      msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
        --virtual-time-budget=5000 --screenshot=assets/img/social-preview.png \
        http://localhost:8000/tools/social-preview.html
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Pixelify+Sans:wght@700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* fixed sizes in place of the site's viewport-relative ones */
    :root { --u: 6px; --card: 372px; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }

    .og {
      position: relative;
      display: flex;
      align-items: center;
      gap: 92px;
      height: 100%;
      padding: 0 0 6px 92px;
    }
    .og .card { flex: none; cursor: default; }
    .og .eye { opacity: .5; }

    .og-copy { position: relative; width: 600px; padding: 34px 36px 32px; }

    .og .kicker { font-size: 15px; }

    .og .title {
      margin: 18px 0 0;
      font-size: 102px;
      line-height: 1;
      cursor: default;
    }

    .og .tag { margin-top: 26px; font-size: 18px; }
    .og .tag span { min-width: 0; }

    .og .bone-rule { margin-top: 30px; }

    .og .og-foot {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 18px 0 0;
      font-size: 22px;
      letter-spacing: .06em;
      color: var(--neon);
    }
    .og-skull {
      width: 28px;
      height: 32px;
      background: var(--img-skull) center / contain no-repeat;
    }
    .og-foot small {
      margin-left: auto;
      font-size: 14px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--bone);
    }

    /* the blog's rainbow reading bar, along the bottom edge */
    .og-rainbow {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 8px;
      background: linear-gradient(90deg,
        var(--red) 0 16.6%, var(--orange) 16.6% 33.3%, var(--yellow) 33.3% 50%,
        var(--cyan) 50% 66.6%, #5b7bff 66.6% 83.3%, var(--purple) 83.3%);
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <main class="og">
    <span class="card" id="card">
      <span class="layer" style="--k:5; --c:#b061ff"></span>
      <span class="layer" style="--k:4; --c:#3fe0ff"></span>
      <span class="layer" style="--k:3; --c:#ffe95c"></span>
      <span class="layer" style="--k:2; --c:#ff9f43"></span>
      <span class="layer" style="--k:1; --c:#ff4f79"></span>
      <span class="frame">
        <span class="art">
          <img src="../assets/img/dootlord.png" width="460" height="460" alt="">
          <span class="eye"></span>
        </span>
      </span>
    </span>

    <div class="og-copy panel">
      <p class="kicker"><span>8+ yrs</span>software engineer</p>
      <h1 class="title gloss">DOOTLORD</h1>
      <p class="tag"><span>Production software, end to end</span></p>
      <span class="bone-rule" aria-hidden="true"></span>
      <p class="og-foot"><span class="og-skull" aria-hidden="true"></span>dootlord.meme<small>CV · Blog · Projects</small></p>
    </div>
  </main>

  <div class="og-rainbow" aria-hidden="true"></div>

  <script type="module">
    import { createBackground } from '../assets/js/bg.js';
    import { installSprites } from '../assets/js/cv.js';

    installSprites();
    await document.fonts.ready;

    // headless browsers can report a viewport shorter than the screenshot;
    // pin it so the background covers the whole image
    for (const [k, v] of [['innerWidth', 1200], ['innerHeight', 630]]) {
      Object.defineProperty(window, k, { value: v, configurable: true });
    }

    // the splash background, frozen with everything switched on and the
    // rings and glow centred on the card
    const bg = createBackground(document.getElementById('bg'));
    const r = document.getElementById('card').getBoundingClientRect();
    bg.setCenter(r.left + r.width / 2, r.top + r.height / 2, r.width / 2);
    Object.assign(bg.state, { rings: 1, rainbow: 1, sparks: 1, dim: 0 });
    bg.renderStatic();
  </script>
</body>
</html>
