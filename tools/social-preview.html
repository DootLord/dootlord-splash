<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DOOTLORD social preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #0b0d10;
      color: #84e3b6;
      font-family: monospace;
    }
    main {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 75px;
      border: 16px solid #2c333b;
      box-shadow: inset 0 0 0 6px #5fa890;
    }
    img {
      width: 400px;
      height: 400px;
      border: 8px solid #7dffc8;
      box-shadow: -12px 12px #b061ff, -24px 24px #3fe0ff;
    }
    .copy { padding-left: 72px; }
    h1 { font-size: 76px; letter-spacing: 3px; margin: 0 0 28px; color: #7dffc8; }
    p { font-size: 25px; line-height: 1.5; margin: 0; }
    .url { color: #b061ff; margin-top: 40px; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/img/dootlord.png" alt="">
    <div class="copy">
      <h1>DOOTLORD</h1>
      <p>Software engineering,<br>games and added doot.</p>
      <p class="url">dootlord.meme</p>
    </div>
  </main>
</body>
</html>
